webrtc:
    listen: ":8555"
    # candidates:
    #   - <IP_PUBLICA_DE_TU_VPS>:8555
    #   - stun:8555

ffmpeg:
    # Sobrescribimos la forma en que go2rtc lee los archivos locales para activar
    # el bucle (-stream_loop -1) de forma limpia
    file: '-re -stream_loop -1 -i {input}'

streams:
    # Ahora simplemente apuntamos al archivo del video 1 y go2rtc usará el preset de arriba
    camara1: ffmpeg:/app/video.mp4#video=mjpeg
